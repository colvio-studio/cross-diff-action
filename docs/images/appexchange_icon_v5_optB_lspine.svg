<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_c2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="lspine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="25%" stop-color="#4338CA"/>
      <stop offset="75%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow_diff_c2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>
    <filter id="glow_arc_c2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.65"/>
    </filter>
    <filter id="card_shadow_c2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F0E26" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg_c2)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- SLEEK INTEGRATED L-SPINE (Unified Header Frame) -->
  <!-- A single elegant ribbon in the gap that curves around the board -->
  <path d="M 46 416 L 46 80 Q 46 46 80 46 L 416 46" fill="none" stroke="url(#lspine)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 46 416 L 46 80 Q 46 46 80 46 L 416 46" fill="none" stroke="#818CF8" stroke-opacity="0.4" stroke-width="14" stroke-linecap="round"/>

  <!-- Minimal Tick Notches on L-Spine (Column 1, 2, 3 and Row 1, 2, 3) -->
  <!-- Row 3 Notch (Origin of Transpose - Cyan Glowing Pill) -->
  <rect x="40" y="340" width="12" height="48" rx="6" fill="#38BDF8"/>
  <!-- Row 2 Notch -->
  <rect x="42" y="234" width="8" height="36" rx="4" fill="#A5B4FC" fill-opacity="0.6"/>
  <!-- Row 1 Notch -->
  <rect x="42" y="128" width="8" height="36" rx="4" fill="#A5B4FC" fill-opacity="0.6"/>

  <!-- Col 1 Notch -->
  <rect x="128" y="42" width="36" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.6"/>
  <!-- Col 2 Notch -->
  <rect x="234" y="42" width="36" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.6"/>
  <!-- Col 3 Notch (Target of Transpose - Cyan Glowing Pill) -->
  <rect x="340" y="40" width="48" height="12" rx="6" fill="#38BDF8"/>

  <!-- Main Board Platform -->
  <g transform="translate(76, 76)" filter="url(#card_shadow_c2)">
    <rect width="360" height="360" rx="40" fill="#1E1B4B" fill-opacity="0.65" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Transposed 3x3 Matrix Grid -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="104" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="208" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#A5B4FC"/>
    </g>

    <!-- Column 2 -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#E0E7FF"/>

      <!-- Center Base Highlight Cell -->
      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" fill-opacity="0.6" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#E0E7FF"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(246, 32)">
      <rect y="0" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="38" width="54" height="10" rx="5" fill="#64748B"/>

      <!-- Row 2: THE DIFF TARGET CELL (GOLD HIGHLIGHT WITH ≠) -->
      <g filter="url(#glow_diff_c2)">
        <rect y="104" width="82" height="86" rx="18" fill="url(#diff_gold_c2)" stroke="#FEF08A" stroke-width="3"/>
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="140" x2="60" y2="140"/>
          <line x1="22" y1="154" x2="60" y2="154"/>
          <line x1="52" y1="129" x2="30" y2="165"/>
        </g>
      </g>

      <rect y="208" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#64748B"/>
    </g>
  </g>

  <!-- DYNAMIC TRANSPOSE ARROW: Connecting Row 3 Notch on Spine -> Col 3 Notch on Spine -->
  <g filter="url(#glow_arc_c2)">
    <path d="M 46 340 C 46 120, 140 46, 335 46" fill="none" stroke="url(#arc_c2)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 46 340 C 46 120, 140 46, 335 46" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
    <polygon points="358,46 328,32 334,60" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>