  <g transform="translate(24, 50)" font-family="-apple-system, sans-serif" font-size="13">
    <text x="12" y="27" font-weight="600" fill="#706E6B">Home</text>
    <text x="80" y="27" font-weight="600" fill="#706E6B">Accounts</text>
    <text x="165" y="27" font-weight="600" fill="#706E6B">Opportunities</text>
    
    <rect x="270" y="0" width="155" height="44" fill="#F3F3F3"/>
    <line x1="270" y1="42" x2="425" y2="42" stroke="#0176D3" stroke-width="3"/>
    <text x="290" y="27" font-weight="700" fill="#0176D3">☷ CrossDiffAction</text>

    <!-- Custom Reports Tab with Highlight -->
    <text x="455" y="27" font-weight="700" fill="#0F172A">Reports (Audit Logs)</text>
    <circle cx="585" cy="23" r="3" fill="#0176D3"/>
    
