        <text x="1108" y="27" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">2026-09-30</text>
        <text x="1463" y="27" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">2026-12-15</text>
