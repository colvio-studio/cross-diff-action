        <text x="753" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">$120,000 [Diff]</text>
        <text x="1108" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">$780,000 [Diff]</text>
        <text x="1463" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">$310,000 [Diff]</text>
