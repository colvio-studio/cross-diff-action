          <text y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#D1FAE5">
            🛡️ Audit Log Recorded: <tspan font-weight="700">CrossDiff_Export_Log__c #EXP-00142</tspan> (User: Admin, Type: XLSX, 100% In-Memory)
          </text>
