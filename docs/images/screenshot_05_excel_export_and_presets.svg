<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Salesforce Lightning Experience Outer Shell -->
  <rect width="1920" height="1080" fill="#F3F3F3"/>

  <!-- Global Header (SLDS Header) -->
  <rect width="1920" height="50" fill="#FFFFFF" stroke="#D8DDE6"/>
  <g transform="translate(18, 15)">
    <circle cx="3" cy="3" r="2.5" fill="#706E6B"/>
    <circle cx="10" cy="3" r="2.5" fill="#706E6B"/>
    <circle cx="17" cy="3" r="2.5" fill="#706E6B"/>
    <circle cx="3" cy="10" r="2.5" fill="#706E6B"/>
    <circle cx="10" cy="10" r="2.5" fill="#706E6B"/>
    <circle cx="17" cy="10" r="2.5" fill="#706E6B"/>
    <circle cx="3" cy="17" r="2.5" fill="#706E6B"/>
    <circle cx="10" cy="17" r="2.5" fill="#706E6B"/>
    <circle cx="17" cy="17" r="2.5" fill="#706E6B"/>
