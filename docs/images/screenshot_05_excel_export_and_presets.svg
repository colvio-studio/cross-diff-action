        <text x="398" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#1D4ED8">Negotiation / Review</text>
        <text x="753" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">Proposal / Price Quote [Diff]</text>
        <text x="1108" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">Closed Won [Diff]</text>
        <text x="1463" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#92400E">Id. Decision Makers [Diff]</text>
