      <text x="8" y="24" font-size="18" fill="#FFFFFF">☷</text>
      
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#0F172A">CrossDiffAction</text>
      <rect x="235" y="6" width="90" height="24" rx="12" fill="#E0E7FF"/>
      <text x="246" y="22" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#4338CA">ENTERPRISE</text>

