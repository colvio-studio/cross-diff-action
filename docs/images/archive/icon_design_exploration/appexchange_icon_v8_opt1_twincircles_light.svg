<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Clean Light Ice/Indigo Gradient -->
    <linearGradient id="bg_p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Transpose Arc: Vibrant Indigo to Electric Cyan Gradient -->
    <linearGradient id="arc_p1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Royal Indigo Circle Gradient -->
    <linearGradient id="circle_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Gold Circle Gradient -->
    <linearGradient id="circle_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadows for 3D Float -->
    <filter id="shadow_p1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.2"/>
    </filter>
    <filter id="gold_glow_p1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
    <filter id="arc_shadow_p1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container (512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bg_p1)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#C7D2FE" stroke-width="4"/>

  <!-- TWO PURE CIRCLES (Centered lower, no text, absolute color purity) -->
  <!-- LEFT CIRCLE: Royal Indigo -->
  <g filter="url(#shadow_p1)">
    <circle cx="236" cy="288" r="60" fill="url(#circle_blue)"/>
    <circle cx="236" cy="288" r="58.5" fill="none" stroke="#818CF8" stroke-width="3"/>
  </g>

  <!-- RIGHT CIRCLE: Vibrant Gold / Amber -->
  <g filter="url(#gold_glow_p1)">
    <circle cx="368" cy="288" r="60" fill="url(#circle_gold)"/>
    <circle cx="368" cy="288" r="58.5" fill="none" stroke="#FEF08A" stroke-width="3"/>
  </g>

  <!-- EXTRA BOLD GENTLE SWEEPING ARC ARROW (Stroke 40px, gentle diagonal curve) -->
  <g filter="url(#arc_shadow_p1)">
    <!-- Gentle slope: start at (70, 420), gentle arch through (120, 210) and (240, 95) to (400, 95) -->
    <path d="M 70 420 C 110 200, 220 95, 395 95" fill="none" stroke="url(#arc_p1)" stroke-width="40" stroke-linecap="round"/>
    <path d="M 70 420 C 110 200, 220 95, 395 95" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 16"/>
    <!-- Large Sharp Arrowhead -->
    <polygon points="440,95 385,62 396,128" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>