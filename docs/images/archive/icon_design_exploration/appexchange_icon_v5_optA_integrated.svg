<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_c1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow_diff_c1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>
    <filter id="glow_arc_c1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
    <filter id="card_shadow_c1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0F0E26" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container (512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bg_c1)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Clean Negative Space around Board -->
  <g transform="translate(68, 68)" filter="url(#card_shadow_c1)">
    <!-- Board Base (376x376) -->
    <rect width="376" height="376" rx="44" fill="#1E1B4B" fill-opacity="0.75" stroke="#6366F1" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Transposed 3x3 Matrix Grid -->
    <!-- ROW 1 (Column Headers across Top) -->
    <!-- Col 1 Header (Top-Left Origin / Corner) -->
    <rect x="28" y="28" width="94" height="94" rx="22" fill="#312E81" fill-opacity="0.5" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="47" y="70" width="56" height="10" rx="5" fill="#A5B4FC" fill-opacity="0.6"/>

    <!-- Col 2 Header (Top-Center) -->
    <rect x="141" y="28" width="94" height="94" rx="22" fill="#312E81" fill-opacity="0.5" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="160" y="70" width="56" height="10" rx="5" fill="#A5B4FC" fill-opacity="0.6"/>

    <!-- Col 3 Header (Top-Right: TARGET OF TRANSPOSE - Active Cyan) -->
    <rect x="254" y="28" width="94" height="94" rx="22" fill="#0284C7" fill-opacity="0.4" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="273" y="70" width="56" height="10" rx="5" fill="#BAE6FD"/>

    <!-- ROW 2 -->
    <!-- Row 2 Header (Left-Center) -->
    <rect x="28" y="141" width="94" height="94" rx="22" fill="#312E81" fill-opacity="0.5" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="47" y="183" width="56" height="10" rx="5" fill="#A5B4FC" fill-opacity="0.6"/>

    <!-- Row 2 Col 2 (Center Base Cell) -->
    <rect x="141" y="141" width="94" height="94" rx="22" fill="#4F46E5" fill-opacity="0.7" stroke="#818CF8" stroke-width="2"/>
    <rect x="160" y="183" width="56" height="10" rx="5" fill="#FFFFFF"/>

    <!-- Row 2 Col 3 (THE DIFF TARGET CELL: GOLD HIGHLIGHT WITH ≠) -->
    <g filter="url(#glow_diff_c1)">
      <rect x="254" y="141" width="94" height="94" rx="22" fill="url(#diff_gold_c1)" stroke="#FEF08A" stroke-width="3"/>
      <!-- Discrepancy Glyph '≠' -->
      <g stroke="#78350F" stroke-width="5" stroke-linecap="round">
        <line x1="281" y1="181" x2="321" y2="181"/>
        <line x1="281" y1="195" x2="321" y2="195"/>
        <line x1="313" y1="169" x2="289" y2="207"/>
      </g>
    </g>

    <!-- ROW 3 -->
    <!-- Row 3 Header (Bottom-Left: ORIGIN OF TRANSPOSE - Active Cyan) -->
    <rect x="28" y="254" width="94" height="94" rx="22" fill="#0284C7" fill-opacity="0.4" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="47" y="296" width="56" height="10" rx="5" fill="#38BDF8"/>

    <!-- Row 3 Col 2 (Bottom-Center Data Cell) -->
    <rect x="141" y="254" width="94" height="94" rx="22" fill="#312E81" fill-opacity="0.3" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="160" y="296" width="56" height="10" rx="5" fill="#A5B4FC" fill-opacity="0.4"/>

    <!-- Row 3 Col 3 (Bottom-Right Data Cell) -->
    <rect x="254" y="254" width="94" height="94" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
    <rect x="273" y="296" width="56" height="10" rx="5" fill="#64748B"/>

    <!-- DYNAMIC TRANSPOSE ARROW: Bottom-Left Header (Row 3) -> Top-Right Header (Col 3) -->
    <g filter="url(#glow_arc_c1)">
      <!-- Seamless arch directly connecting Row 3 Header to Col 3 Header -->
      <path d="M 75 254 C 75 75, 120 40, 250 40" fill="none" stroke="url(#arc_c1)" stroke-width="15" stroke-linecap="round"/>
      <path d="M 75 254 C 75 75, 120 40, 250 40" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
      <!-- Sharp Arrowhead landing on Col 3 Header -->
      <polygon points="274,40 244,26 250,54" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>