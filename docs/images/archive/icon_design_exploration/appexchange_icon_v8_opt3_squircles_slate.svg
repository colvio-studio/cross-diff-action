<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="arc_p3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="squircle_indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="squircle_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow_gold_p3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.8"/>
    </filter>
    <filter id="glow_indigo_p3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow_arc_p3" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg_p3)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- TWO SQUIRCLES (Super-ellipses: rx=44 for ultra-smooth organic squircle curve) -->
  <!-- LEFT SQUIRCLE: Rich Indigo -->
  <g filter="url(#glow_indigo_p3)">
    <rect x="178" y="230" width="118" height="118" rx="42" fill="url(#squircle_indigo)" stroke="#818CF8" stroke-width="3"/>
  </g>

  <!-- RIGHT SQUIRCLE: Sunburst Gold -->
  <g filter="url(#glow_gold_p3)">
    <rect x="318" y="230" width="118" height="118" rx="42" fill="url(#squircle_gold)" stroke="#FEF08A" stroke-width="3.5"/>
  </g>

  <!-- EXTRA BOLD GENTLE SWEEPING ARC ARROW (Stroke 40px Solid Gradient + White Edge) -->
  <g filter="url(#shadow_arc_p3)">
    <!-- White Underlayer for max crispness -->
    <path d="M 70 420 C 110 200, 220 95, 395 95" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <!-- Cyan/Indigo Gradient Core -->
    <path d="M 70 420 C 110 200, 220 95, 395 95" fill="none" stroke="url(#arc_p3)" stroke-width="38" stroke-linecap="round"/>
    <!-- Bold Sharp Arrowhead -->
    <polygon points="445,95 390,60 400,130" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>