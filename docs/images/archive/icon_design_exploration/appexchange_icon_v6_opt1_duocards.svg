<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_u1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_u1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_u1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow_diff_u1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#F59E0B" flood-opacity="0.7"/>
    </filter>
    <filter id="glow_arc_u1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.75"/>
    </filter>
    <filter id="card_shadow_u1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0F0E26" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container (512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bg_u1)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- TWO HORIZONTAL CARDS (Centered in right half) -->
  <g transform="translate(190, 160)" filter="url(#card_shadow_u1)">
    <!-- LEFT CARD: Base Data (Indigo / Cyan border) -->
    <rect x="0" y="0" width="116" height="156" rx="26" fill="#1E1B4B" fill-opacity="0.75" stroke="#6366F1" stroke-width="3"/>
    <!-- Minimal Card Lines -->
    <rect x="22" y="32" width="72" height="14" rx="7" fill="#818CF8" fill-opacity="0.5"/>
    <rect x="22" y="60" width="72" height="14" rx="7" fill="#A5B4FC" fill-opacity="0.7"/>
    <rect x="22" y="88" width="52" height="14" rx="7" fill="#818CF8" fill-opacity="0.5"/>

    <!-- RIGHT CARD: Compared Target (Vibrant Gold Diff Card with ≠) -->
    <g transform="translate(136, 0)" filter="url(#glow_diff_u1)">
      <rect x="0" y="0" width="116" height="156" rx="26" fill="url(#diff_gold_u1)" stroke="#FEF08A" stroke-width="3.5"/>
      <!-- Discrepancy Glyph '≠' (Bold) -->
      <g stroke="#78350F" stroke-width="6.5" stroke-linecap="round">
        <line x1="28" y1="66" x2="88" y2="66"/>
        <line x1="28" y1="88" x2="88" y2="88"/>
        <line x1="76" y1="46" x2="40" y2="108"/>
      </g>
    </g>
  </g>

  <!-- BOLD DYNAMIC ARCH ARROW (Left-Bottom to Top-Right) -->
  <g filter="url(#glow_arc_u1)">
    <!-- Extra Bold Neon Tube (Stroke width 26px!) -->
    <path d="M 85 415 C 85 160, 200 85, 385 85" fill="none" stroke="url(#arc_u1)" stroke-width="26" stroke-linecap="round"/>
    <!-- Sleek Center Dashed Core -->
    <path d="M 85 415 C 85 160, 200 85, 385 85" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12"/>
    <!-- Prominent Dynamic Arrowhead -->
    <polygon points="426,85 378,60 388,110" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>