<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="opt3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#EDF2F7"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="lens_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold_grad_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="opt3_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="lens_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container (Bright Clean Theme) -->
  <rect width="512" height="512" rx="112" fill="url(#opt3_bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#CBD5E1" stroke-width="4"/>

  <!-- Matrix Base Board -->
  <g transform="translate(76, 76)" filter="url(#opt3_shadow)">
    <rect width="360" height="360" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Transposed 3x3 Matrix Cells in Light Theme -->
    <!-- Column 1 (Y-Axis Labels) -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#94A3B8"/>

      <rect y="104" width="86" height="86" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#94A3B8"/>

      <rect y="208" width="86" height="86" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="16" y="246" width="44" height="10" rx="5" fill="#94A3B8"/>
    </g>

    <!-- Column 2 (Base Record) -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <rect x="16" y="38" width="60" height="10" rx="5" fill="#3B82F6"/>

      <rect y="104" width="92" height="86" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <rect x="16" y="142" width="60" height="10" rx="5" fill="#1D4ED8"/>

      <rect y="208" width="92" height="86" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <rect x="16" y="246" width="50" height="10" rx="5" fill="#3B82F6"/>
    </g>

    <!-- Column 3 (Compared Record) -->
    <g transform="translate(246, 32)">
      <rect y="0" width="82" height="86" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="14" y="38" width="54" height="10" rx="5" fill="#CBD5E1"/>

      <!-- Behind the lens: cell placeholder -->
      <rect y="104" width="82" height="86" rx="16" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>

      <rect y="208" width="82" height="86" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#CBD5E1"/>
    </g>

    <!-- DIFF FINDER LENS (Magnifying Glass focusing on Row 2, Col 3) -->
    <g transform="translate(225, 100)" filter="url(#lens_shadow)">
      <!-- Lens Handle -->
      <rect x="75" y="75" width="64" height="18" rx="9" transform="rotate(45 75 75)" fill="url(#lens_grad)"/>

      <!-- Outer Ring of Lens -->
      <circle cx="50" cy="50" r="56" fill="#0F172A" stroke="#0284C7" stroke-width="6"/>
      <!-- Inner Glass Highlight -->
      <circle cx="50" cy="50" r="48" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>

      <!-- Glowing Diff Symbol: Mathematical '≠' (Difference Found!) -->
      <g stroke="#D97706" stroke-width="5" stroke-linecap="round">
        <line x1="32" y1="44" x2="68" y2="44"/>
        <line x1="32" y1="56" x2="68" y2="56"/>
        <line x1="62" y1="32" x2="38" y2="68" stroke="#B45309"/>
      </g>
    </g>
  </g>
</svg>