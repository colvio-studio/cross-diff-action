<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="opt1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A1E0"/>
      <stop offset="50%" stop-color="#0176D3"/>
      <stop offset="100%" stop-color="#0B4E8C"/>
    </linearGradient>
    <linearGradient id="arrow_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="opt1_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="opt1_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base App Icon Container (512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#opt1_bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <g transform="translate(76, 76)" filter="url(#opt1_shadow)">
    <!-- Semi-transparent Base Plate -->
    <rect width="360" height="360" rx="36" fill="#0F172A" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

    <!-- Transposed Grid Structure (3x3 Minimal Pills) -->
    <!-- Row 1: Horizontal source bars -->
    <g transform="translate(36, 40)">
      <rect x="0" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="16" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>

      <rect x="100" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="116" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>

      <rect x="200" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="216" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(36, 130)">
      <rect x="0" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="16" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>

      <!-- Center Pillar (Base) -->
      <rect x="100" y="0" width="86" height="76" rx="16" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
      <rect x="116" y="32" width="54" height="12" rx="6" fill="#0176D3"/>

      <!-- THE DIFF CELL: Vibrant Amber Prism -->
      <g filter="url(#opt1_glow)">
        <rect x="200" y="0" width="86" height="76" rx="16" fill="url(#arrow_gold)" stroke="#FEF08A" stroke-width="3"/>
        <path d="M 230 45 L 243 27 L 256 45 Z" fill="#78350F"/>
        <rect x="241" y="34" width="4" height="6" rx="2" fill="#FEF3C7"/>
        <circle cx="243" cy="43" r="1.8" fill="#FEF3C7"/>
      </g>
    </g>

    <!-- Row 3 -->
    <g transform="translate(36, 220)">
      <rect x="0" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="16" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>

      <rect x="100" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="116" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>

      <rect x="200" y="0" width="86" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.15"/>
      <rect x="216" y="32" width="54" height="12" rx="6" fill="#93C5FD"/>
    </g>

    <!-- BOLD TRANSPOSE ARROW: Sweeping 90-degree curve across the grid -->
    <path d="M 65 65 C 65 240, 180 280, 240 280" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M 65 65 C 65 240, 180 280, 240 280" fill="none" stroke="url(#arrow_gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12"/>
    <!-- Large Arrowhead pointing rightwards into the column -->
    <polygon points="265,280 235,260 235,300" fill="#FFFFFF" stroke="url(#arrow_gold)" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>