<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_1a2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_cyan_1a2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_1a2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rail_x_1a2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rail_y_1a2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow_diff_1a2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>
    <filter id="glow_arc_1a2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
    <filter id="card_shadow_1a2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F0E26" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg_1a2)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- CONTINUOUS RULER RAILS (X and Y Axis) -->
  <!-- Corner Joint Anchor Origin (0,0 of Matrix) -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="22" height="22" rx="7" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <circle cx="11" cy="11" r="4" fill="#38BDF8"/>
  </g>

  <!-- Top Column Header Ruler Bar -->
  <g transform="translate(76, 42)">
    <rect x="0" y="0" width="340" height="18" rx="9" fill="#1E1B4B" fill-opacity="0.7" stroke="url(#rail_x_1a2)" stroke-width="2"/>
    <!-- Col 1 Slot -->
    <rect x="42" y="3" width="66" height="12" rx="6" fill="#818CF8" fill-opacity="0.6"/>
    <!-- Col 2 Slot -->
    <rect x="148" y="3" width="68" height="12" rx="6" fill="#A5B4FC" fill-opacity="0.8"/>
    <!-- Col 3 Slot (Active Target) -->
    <rect x="254" y="3" width="66" height="12" rx="6" fill="#38BDF8"/>
  </g>

  <!-- Left Row Header Ruler Bar -->
  <g transform="translate(42, 76)">
    <rect x="0" y="0" width="18" height="340" rx="9" fill="#1E1B4B" fill-opacity="0.7" stroke="url(#rail_y_1a2)" stroke-width="2"/>
    <!-- Row 1 Slot -->
    <rect x="3" y="42" width="12" height="66" rx="6" fill="#818CF8" fill-opacity="0.6"/>
    <!-- Row 2 Slot -->
    <rect x="3" y="148" width="12" height="68" rx="6" fill="#818CF8" fill-opacity="0.6"/>
    <!-- Row 3 Slot (Active Transpose Origin) -->
    <rect x="3" y="254" width="12" height="66" rx="6" fill="#38BDF8"/>
  </g>

  <!-- Main Board Platform -->
  <g transform="translate(76, 76)" filter="url(#card_shadow_1a2)">
    <rect width="360" height="360" rx="40" fill="#1E1B4B" fill-opacity="0.65" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Transposed 3x3 Grid -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="104" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="208" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.5" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#38BDF8"/>
    </g>

    <!-- Column 2 -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#E0E7FF"/>

      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" fill-opacity="0.6" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#E0E7FF"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(246, 32)">
      <g filter="url(#glow_diff_1a2)">
        <rect y="0" width="82" height="86" rx="18" fill="url(#diff_gold_1a2)" stroke="#FEF08A" stroke-width="3"/>
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="36" x2="60" y2="36"/>
          <line x1="22" y1="50" x2="60" y2="50"/>
          <line x1="52" y1="25" x2="30" y2="61"/>
        </g>
      </g>

      <rect y="104" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="142" width="54" height="10" rx="5" fill="#64748B"/>

      <rect y="208" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#64748B"/>
    </g>

    <!-- DYNAMIC TRANSPOSE ARROW -->
    <g filter="url(#glow_arc_1a2)">
      <path d="M 75 240 C 75 70, 160 18, 236 32" fill="none" stroke="url(#arc_cyan_1a2)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 75 240 C 75 70, 160 18, 236 32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
      <polygon points="256,36 226,18 234,48" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>