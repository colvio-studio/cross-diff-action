<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Colvio Signature Royal Indigo Gradient -->
    <linearGradient id="bg_v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Transpose Arc: Electric Cyan to Pure White Gradient -->
    <linearGradient id="arc_cyan_v4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Diff Gold Gradient -->
    <linearGradient id="diff_gold_v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow_diff_v4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.7"/>
    </filter>
    <filter id="glow_arc_v4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.65"/>
    </filter>
    <filter id="card_shadow_v4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F0E26" flood-opacity="0.55"/>
    </filter>
    <filter id="glow_pill_v4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container (512x512 with 112px radius) -->
  <rect width="512" height="512" rx="112" fill="url(#bg_v4)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- ==================== HEADER PILL CHIPS (OUTER - INNER GAP) ==================== -->
  <!-- TOP: COLUMN HEADERS (X-Axis) -->
  <g transform="translate(76, 36)">
    <!-- Column 1 Header Chip -->
    <rect x="32" y="0" width="86" height="24" rx="8" fill="#4F46E5" fill-opacity="0.45" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="53" y="8" width="44" height="8" rx="4" fill="#C7D2FE"/>

    <!-- Column 2 Header Chip (Base / Anchor Column) -->
    <rect x="136" y="0" width="92" height="24" rx="8" fill="#4F46E5" fill-opacity="0.45" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="158" y="8" width="48" height="8" rx="4" fill="#C7D2FE"/>

    <!-- Column 3 Header Chip (TARGET OF TRANSPOSE - Active Glowing Cyan) -->
    <g filter="url(#glow_pill_v4)">
      <rect x="246" y="0" width="82" height="24" rx="8" fill="#0284C7" fill-opacity="0.6" stroke="#38BDF8" stroke-width="2.5"/>
      <rect x="264" y="8" width="46" height="8" rx="4" fill="#E0F2FE"/>
    </g>
  </g>

  <!-- LEFT: ROW HEADERS (Y-Axis) -->
  <g transform="translate(36, 76)">
    <!-- Row 1 Header Chip -->
    <rect x="0" y="32" width="24" height="86" rx="8" fill="#4F46E5" fill-opacity="0.45" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="8" y="53" width="8" height="44" rx="4" fill="#C7D2FE"/>

    <!-- Row 2 Header Chip -->
    <rect x="0" y="136" width="24" height="86" rx="8" fill="#4F46E5" fill-opacity="0.45" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="8" y="158" width="8" height="48" rx="4" fill="#C7D2FE"/>

    <!-- Row 3 Header Chip (ORIGIN OF TRANSPOSE - Active Glowing Cyan) -->
    <g filter="url(#glow_pill_v4)">
      <rect x="0" y="240" width="24" height="86" rx="8" fill="#0284C7" fill-opacity="0.6" stroke="#38BDF8" stroke-width="2.5"/>
      <rect x="8" y="260" width="8" height="46" rx="4" fill="#E0F2FE"/>
    </g>
  </g>

  <!-- ==================== MAIN BOARD PLATFORM ==================== -->
  <g transform="translate(76, 76)" filter="url(#card_shadow_v4)">
    <rect width="360" height="360" rx="40" fill="#1E1B4B" fill-opacity="0.65" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Transposed 3x3 Matrix Grid -->
    <!-- Column 1 (Left Field Labels) -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="104" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="208" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#A5B4FC"/>
    </g>

    <!-- Column 2 (Center Base Record) -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#E0E7FF"/>

      <!-- Center Base Highlight Cell -->
      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" fill-opacity="0.6" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#E0E7FF"/>
    </g>

    <!-- Column 3 (Right Compared Record) -->
    <g transform="translate(246, 32)">
      <!-- Row 1: Regular Cell (Inactive/Match) -->
      <rect y="0" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="38" width="54" height="10" rx="5" fill="#64748B"/>

      <!-- Row 2: THE DIFF TARGET CELL (GOLD HIGHLIGHT WITH ≠ GLYPH) -->
      <g filter="url(#glow_diff_v4)">
        <rect y="104" width="82" height="86" rx="18" fill="url(#diff_gold_v4)" stroke="#FEF08A" stroke-width="3"/>
        <!-- Discrepancy Glyph '≠' (Bold Amber/Brown) -->
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="140" x2="60" y2="140"/>
          <line x1="22" y1="154" x2="60" y2="154"/>
          <line x1="52" y1="129" x2="30" y2="165"/>
        </g>
      </g>

      <!-- Row 3: Regular Cell (Inactive/Match) -->
      <rect y="208" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#64748B"/>
    </g>
  </g>

  <!-- ==================== DYNAMIC TRANSPOSE ARROW ==================== -->
  <!-- From Bottom Row Header (x=48, y=360) -> Arch Up -> Land at Rightmost Col Header (x=360, y=48) -->
  <g filter="url(#glow_arc_v4)">
    <!-- Outer Glow / Cyan Gradient Tube -->
    <path d="M 52 345 C 52 140, 160 48, 318 48" fill="none" stroke="url(#arc_cyan_v4)" stroke-width="14" stroke-linecap="round"/>
    <!-- Inner White Dashed Core -->
    <path d="M 52 345 C 52 140, 160 48, 318 48" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
    <!-- Sharp Prominent Arrowhead pointing rightward directly into Column 3 Header -->
    <polygon points="340,48 310,34 316,62" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>