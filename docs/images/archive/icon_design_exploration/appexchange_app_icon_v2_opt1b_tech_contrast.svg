<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Transpose Arc: Vibrant Indigo to Electric Cyan -->
    <linearGradient id="arc_1b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glow_diff_1b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
    <filter id="shadow_1b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg_1b)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="4"/>

  <g transform="translate(76, 76)" filter="url(#shadow_1b)">
    <rect width="360" height="360" rx="40" fill="#1E293B" fill-opacity="0.6" stroke="#475569" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Transposed 3x3 Grid -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#334155" fill-opacity="0.5" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#94A3B8"/>

      <rect y="104" width="86" height="86" rx="18" fill="#334155" fill-opacity="0.5" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#94A3B8"/>

      <!-- Start Cell at Bottom-Left -->
      <rect y="208" width="86" height="86" rx="18" fill="#4F46E5" fill-opacity="0.4" stroke="#818CF8" stroke-width="2"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#818CF8"/>
    </g>

    <!-- Column 2 (Base Column) -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#334155" fill-opacity="0.4" stroke="#64748B" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#CBD5E1"/>

      <rect y="104" width="92" height="86" rx="18" fill="#0284C7" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#334155" fill-opacity="0.4" stroke="#64748B" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#CBD5E1"/>
    </g>

    <!-- Column 3 (Target Column) -->
    <g transform="translate(246, 32)">
      <!-- Target Diff Cell at Top-Right -->
      <g filter="url(#glow_diff_1b)">
        <rect y="0" width="82" height="86" rx="18" fill="#F59E0B" stroke="#FDE68A" stroke-width="3"/>
        <!-- Discrepancy Triangle / Warning Icon -->
        <path d="M 41 26 L 19 62 L 63 62 Z" fill="#78350F" stroke="#FEF3C7" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="41" y1="38" x2="41" y2="48" stroke="#FEF3C7" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="41" cy="55" r="1.8" fill="#FEF3C7"/>
      </g>

      <rect y="104" width="82" height="86" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="142" width="54" height="10" rx="5" fill="#475569"/>

      <rect y="208" width="82" height="86" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#475569"/>
    </g>

    <!-- BOLD ARCHED TRANSPOSE ARROW: Left-Bottom to Right-Top -->
    <!-- Start (75, 250) -> Arc via (80, 50) and (170, 15) -> Land at (240, 30) -->
    <path d="M 75 250 C 75 60, 150 16, 238 28" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M 75 250 C 75 60, 150 16, 238 28" fill="none" stroke="url(#arc_1b)" stroke-width="10" stroke-linecap="round"/>
    <!-- Sharp Arrowhead -->
    <polygon points="258,32 228,14 236,44" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>