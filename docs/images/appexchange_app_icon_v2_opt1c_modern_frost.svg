<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_1c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Transpose Arc: Colvio Indigo to Electric Cyan -->
    <linearGradient id="arc_1c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="diff_gold_1c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadow_1c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#312E81" flood-opacity="0.15"/>
    </filter>
    <filter id="glow_diff_1c" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg_1c)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#C7D2FE" stroke-width="4"/>

  <g transform="translate(76, 76)" filter="url(#shadow_1c)">
    <rect width="360" height="360" rx="40" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>

    <!-- Transposed 3x3 Grid (Light Theme) -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#94A3B8"/>

      <rect y="104" width="86" height="86" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#94A3B8"/>

      <!-- Start Cell at Bottom-Left -->
      <rect y="208" width="86" height="86" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#4F46E5"/>
    </g>

    <!-- Column 2 (Base Column) -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#6366F1"/>

      <!-- Center Base Cell -->
      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" stroke="#312E81" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#6366F1"/>
    </g>

    <!-- Column 3 (Target Column) -->
    <g transform="translate(246, 32)">
      <!-- Target Diff Cell at Top-Right -->
      <g filter="url(#glow_diff_1c)">
        <rect y="0" width="82" height="86" rx="18" fill="url(#diff_gold_1c)" stroke="#FEF08A" stroke-width="3"/>
        <!-- Discrepancy Glyph '≠' -->
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="36" x2="60" y2="36"/>
          <line x1="22" y1="50" x2="60" y2="50"/>
          <line x1="52" y1="25" x2="30" y2="61"/>
        </g>
      </g>

      <rect y="104" width="82" height="86" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="14" y="142" width="54" height="10" rx="5" fill="#CBD5E1"/>

      <rect y="208" width="82" height="86" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#CBD5E1"/>
    </g>

    <!-- BOLD ARCHED TRANSPOSE ARROW: Left-Bottom to Right-Top -->
    <path d="M 75 250 C 75 60, 150 16, 238 28" fill="none" stroke="url(#arc_1c)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 75 250 C 75 60, 150 16, 238 28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
    <polygon points="258,32 228,14 236,44" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>