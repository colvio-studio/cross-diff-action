<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Salesforce Lightning Background (Dimmed under Modal) -->
  <rect width="1920" height="1080" fill="#E2E8F0"/>
  
  <!-- Subtle Background Silhouette of Matrix behind Modal -->
  <g opacity="0.35">
    <rect width="1920" height="50" fill="#FFFFFF"/>
    <rect y="50" width="1920" height="44" fill="#FFFFFF"/>
    <rect x="32" y="142" width="1856" height="895" rx="8" fill="#FFFFFF"/>
  </g>

  <!-- Modal Backdrop Overlay (SLDS Backdrop) -->
  <rect width="1920" height="1080" fill="#0F172A" fill-opacity="0.65"/>

  <!-- ================= SLDS MODAL CONTAINER ================= -->
  <g transform="translate(360, 110)">
    <!-- Modal Dialog Body -->
    <rect width="1200" height="860" rx="8" fill="#FFFFFF" filter="url(#modal_shadow)"/>
    <rect x="0.5" y="0.5" width="1199" height="859" rx="7.5" stroke="#CBD5E1"/>

    <!-- Modal Header -->
    <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 1192 0 C 1196.5 0 1200 3.5 1200 8 L 1200 70 L 0 70 Z" fill="#F8FAFC"/>
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#E2E8F0"/>

    <g transform="translate(28, 22)">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#F59E0B"/>
      <text x="7" y="21" font-size="16" fill="#FFFFFF">⚡</text>
      
      <text x="42" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#0F172A">
        Field Discrepancy Deep Inspection
      </text>
      <text x="42" y="36" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">
        Field: <tspan font-weight="700" fill="#0F172A">Description</tspan> (Rich Text / Long Text Area) • Character-Level Exact Diff
      </text>
    </g>

    <!-- Close Button Top Right -->
    <circle cx="1160" cy="35" r="16" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="1154" y="41" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#64748B">×</text>

    <!-- Modal Subheader / Comparison Target Summary -->
    <g transform="translate(32, 90)">
      <rect width="1136" height="54" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" fill="#1E40AF">
        Comparing <tspan font-weight="800" fill="#1D4ED8">Acme Corporation (Base Record)</tspan> against <tspan font-weight="800" fill="#0F172A">Global Media Inc</tspan>
      </text>
      <rect x="940" y="14" width="175" height="26" rx="4" fill="#DBEAFE"/>
      <text x="955" y="31" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#1E40AF">
        SIMILARITY SCORE: 88.4%
      </text>
    </g>

    <!-- Detailed Diff Cards (Side by Side View) -->
    <g transform="translate(32, 160)">
      <!-- Left Column: Base Record Content -->
      <g transform="translate(0, 0)">
        <rect width="555" height="340" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
        <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 549 0 C 552.5 0 555 2.5 555 6 L 555 40 L 0 40 Z" fill="#F8FAFC"/>
        <line x1="0" y1="40" x2="555" y2="40" stroke="#E2E8F0"/>
        
        <text x="16" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#1D4ED8">
          ★ Acme Corporation (Baseline Value)
        </text>

        <!-- Base Text Body -->
        <g transform="translate(16, 56)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" line-height="22">
          <text y="0" fill="#334155">Global enterprise tier account for NA &amp; EMEA regions.</text>
          <text y="26" fill="#334155">Primary SLA response window: <tspan font-weight="700" fill="#0F172A">15 minutes (24/7)</tspan>.</text>
          <text y="52" fill="#334155">Security review completed: <tspan font-weight="700" fill="#0F172A">Q2 2026 (SOC-2 Type II)</tspan>.</text>
          <text y="78" fill="#334155">Contract status: Active with multi-year commitment.</text>
          <text y="104" fill="#334155">Designated Executive Sponsor: Jane Doe (VP Operations).</text>
          <text y="130" fill="#334155">Target ARR expansion: $2,500,000 in Q4 renewal.</text>
        </g>
      </g>

      <!-- Right Column: Target Record Content -->
      <g transform="translate(581, 0)">
        <rect width="555" height="340" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
        <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 549 0 C 552.5 0 555 2.5 555 6 L 555 40 L 0 40 Z" fill="#F8FAFC"/>
        <line x1="0" y1="40" x2="555" y2="40" stroke="#E2E8F0"/>
        
        <text x="16" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#0F172A">
          Global Media Inc (Compared Value)
        </text>

        <!-- Target Text Body -->
        <g transform="translate(16, 56)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
          <text y="0" fill="#334155">Regional enterprise tier account for APAC &amp; EMEA regions.</text>
          <text y="26" fill="#334155">Primary SLA response window: <tspan font-weight="700" fill="#0F172A">60 minutes (Business Hours)</tspan>.</text>
          <text y="52" fill="#334155">Security review completed: <tspan font-weight="700" fill="#0F172A">Q1 2026 (Pending SOC-2)</tspan>.</text>
          <text y="78" fill="#334155">Contract status: Active with annual renewal.</text>
          <text y="104" fill="#334155">Designated Executive Sponsor: John Smith (Director IT).</text>
          <text y="130" fill="#334155">Target ARR expansion: $800,000 in Q4 renewal.</text>
        </g>
      </g>
    </g>

    <!-- Bottom Unified Inline Char-Diff View (The Visual Spotlight) -->
    <g transform="translate(32, 518)">
      <rect width="1136" height="240" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 1130 0 C 1133.5 0 1136 2.5 1136 6 L 1136 40 L 0 40 Z" fill="#FEF3C7"/>
      <line x1="0" y1="40" x2="1136" y2="40" stroke="#FDE68A"/>

      <text x="16" y="25" font-family="-apple-system, sans-serif" font-weight="800" font-size="13" fill="#92400E">
        🔍 Character &amp; Word Level Diff Visualizer (Inline Synthesis)
      </text>

      <!-- Legend -->
      <g transform="translate(780, 12)">
        <rect x="0" y="0" width="80" height="18" rx="3" fill="#FEE2E2"/>
        <text x="10" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#991B1B">- Removed</text>

        <rect x="90" y="0" width="70" height="18" rx="3" fill="#DCFCE7"/>
        <text x="100" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#166534">+ Added</text>

        <rect x="170" y="0" width="60" height="18" rx="3" fill="#F1F5F9"/>
        <text x="178" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">= Equal</text>
      </g>

      <!-- Inline Diff Text Rendering -->
      <g transform="translate(18, 62)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
        <!-- Line 1 -->
        <g transform="translate(0, 0)">
          <!-- Del: Global -->
          <rect x="0" y="-14" width="56" height="18" rx="2" fill="#FEE2E2"/>
          <text x="4" y="0" fill="#991B1B" text-decoration="line-through">Global</text>

          <!-- Ins: Regional -->
          <rect x="62" y="-14" width="72" height="18" rx="2" fill="#DCFCE7"/>
          <text x="66" y="0" font-weight="bold" fill="#166534">Regional</text>

          <text x="142" y="0" fill="#1E293B">enterprise tier account for</text>

          <!-- Del: NA -->
          <rect x="365" y="-14" width="28" height="18" rx="2" fill="#FEE2E2"/>
          <text x="369" y="0" fill="#991B1B" text-decoration="line-through">NA</text>

          <!-- Ins: APAC -->
          <rect x="398" y="-14" width="42" height="18" rx="2" fill="#DCFCE7"/>
          <text x="402" y="0" font-weight="bold" fill="#166534">APAC</text>

          <text x="446" y="0" fill="#1E293B">&amp; EMEA regions.</text>
        </g>

        <!-- Line 2 -->
        <g transform="translate(0, 32)">
          <text x="0" y="0" fill="#1E293B">Primary SLA response window:</text>

          <!-- Del: 15 minutes (24/7) -->
          <rect x="235" y="-14" width="160" height="18" rx="2" fill="#FEE2E2"/>
          <text x="239" y="0" fill="#991B1B" text-decoration="line-through">15 minutes (24/7)</text>

          <!-- Ins: 60 minutes (Business Hours) -->
          <rect x="402" y="-14" width="250" height="18" rx="2" fill="#DCFCE7"/>
          <text x="406" y="0" font-weight="bold" fill="#166534">60 minutes (Business Hours)</text>

          <text x="658" y="0" fill="#1E293B">.</text>
        </g>

        <!-- Line 3 -->
        <g transform="translate(0, 64)">
          <text x="0" y="0" fill="#1E293B">Security review completed:</text>

          <!-- Del: Q2 2026 (SOC-2 Type II) -->
          <rect x="220" y="-14" width="210" height="18" rx="2" fill="#FEE2E2"/>
          <text x="224" y="0" fill="#991B1B" text-decoration="line-through">Q2 2026 (SOC-2 Type II)</text>

          <!-- Ins: Q1 2026 (Pending SOC-2) -->
          <rect x="438" y="-14" width="210" height="18" rx="2" fill="#DCFCE7"/>
          <text x="442" y="0" font-weight="bold" fill="#166534">Q1 2026 (Pending SOC-2)</text>

          <text x="654" y="0" fill="#1E293B">.</text>
        </g>

        <!-- Line 4 -->
        <g transform="translate(0, 96)">
          <text x="0" y="0" fill="#1E293B">Target ARR expansion:</text>

          <rect x="180" y="-14" width="95" height="18" rx="2" fill="#FEE2E2"/>
          <text x="184" y="0" fill="#991B1B" text-decoration="line-through">$2,500,000</text>

          <rect x="282" y="-14" width="80" height="18" rx="2" fill="#DCFCE7"/>
          <text x="286" y="0" font-weight="bold" fill="#166534">$800,000</text>

          <text x="368" y="0" fill="#1E293B">in Q4 renewal.</text>
        </g>
      </g>
    </g>

    <!-- Modal Footer -->
    <path d="M 0 788 L 1200 788 L 1200 852 C 1200 856.5 1196.5 860 1192 860 L 8 860 C 3.5 860 0 856.5 0 852 Z" fill="#F8FAFC"/>
    <line x1="0" y1="788" x2="1200" y2="788" stroke="#E2E8F0"/>

    <g transform="translate(32, 808)">
      <text x="0" y="24" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748B">
        Pure In-Browser Character Diff Engine • Zero External Cloud Processing
      </text>

      <g transform="translate(860, 4)">
        <rect x="0" y="0" width="130" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="14" y="22" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#475569">📋 Copy Diff</text>

        <rect x="142" y="0" width="120" height="34" rx="4" fill="#0176D3"/>
        <text x="164" y="22" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Close (Esc)</text>
      </g>
    </g>
  </g>

  <!-- Filter Def -->
  <defs>
    <filter id="modal_shadow" x="330" y="85" width="1260" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
</svg>
