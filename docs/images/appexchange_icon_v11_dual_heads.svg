<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_v11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Bi-directional gradient: Indigo at start, Cyan in middle, Pure Blue at end -->
    <linearGradient id="arc_v11" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="circle_blue_v11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="circle_gold_v11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadow_circles_v11" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.22"/>
    </filter>
    <filter id="gold_glow_v11" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
    <filter id="arc_shadow_v11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
</defs>
  <rect width="512" height="512" rx="112" fill="url(#bg_v11)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#C7D2FE" stroke-width="4"/>
  
  <!-- TWO PURE CIRCLES (cy = 325) -->
  <g filter="url(#shadow_circles_v11)">
    <circle cx="236" cy="325" r="62" fill="url(#circle_blue_v11)"/>
    <circle cx="236" cy="325" r="60.5" fill="none" stroke="#818CF8" stroke-width="3"/>
  </g>
  <g filter="url(#gold_glow_v11)">
    <circle cx="368" cy="325" r="62" fill="url(#circle_gold_v11)"/>
    <circle cx="368" cy="325" r="60.5" fill="none" stroke="#FEF08A" stroke-width="3"/>
  </g>


  <g filter="url(#arc_shadow_v11)">
    <!-- Main Arc Body (connected between the two head bases) -->
    <path d="M 75 390 C 110 190, 220 92, 380 92" fill="none" stroke="url(#arc_v11)" stroke-width="38" stroke-linecap="round"/>
    <!-- Solid Crisp White Core Line extending between both heads -->
    <path d="M 72 405 C 112 195, 220 92, 396 92" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- 1. TOP-RIGHT HEAD (指向: 右上) -->
    <path d="M 444 92 L 380 50 L 398 92 L 380 134 Z" fill="#0284C7" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 436 92 L 392 64 L 406 92 L 392 120 Z" fill="#38BDF8" fill-opacity="0.6"/>

    <!-- 2. BOTTOM-LEFT HEAD (指向: 左下・接線方向) -->
    <!-- Tangent angle at (68, 410) is roughly 250 degrees (pointing down-left) -->
    <g transform="translate(68, 415) rotate(105)">
      <path d="M 38 0 L -22 -38 L -6 0 L -22 38 Z" fill="#4F46E5" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 30 0 L -12 -24 L 2 0 L -12 24 Z" fill="#818CF8" fill-opacity="0.6"/>
    </g>
  </g>
</svg>