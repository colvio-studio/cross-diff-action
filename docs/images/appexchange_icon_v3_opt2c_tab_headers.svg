<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_2c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_cyan_2c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_2c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow_diff_2c" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>
    <filter id="glow_arc_2c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
    <filter id="card_shadow_2c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F0E26" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg_2c)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- ==================== INTEGRATED TABS PROTRUDING FROM BOARD ==================== -->
  <!-- Top Protruding Column Tabs -->
  <g transform="translate(76, 52)">
    <!-- Col 1 Tab -->
    <path d="M 36 24 L 36 6 Q 36 0 42 0 L 108 0 Q 114 0 114 6 L 114 24 Z" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="75" cy="11" r="3.5" fill="#A5B4FC"/>

    <!-- Col 2 Tab -->
    <path d="M 142 24 L 142 6 Q 142 0 148 0 L 216 0 Q 222 0 222 6 L 222 24 Z" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="182" cy="11" r="3.5" fill="#A5B4FC"/>

    <!-- Col 3 Tab (Cyan Active Tab for Compared Record) -->
    <path d="M 252 24 L 252 6 Q 252 0 258 0 L 322 0 Q 328 0 328 6 L 328 24 Z" fill="#0284C7" fill-opacity="0.5" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="290" cy="11" r="4" fill="#38BDF8"/>
  </g>

  <!-- Left Protruding Row Tabs -->
  <g transform="translate(52, 76)">
    <!-- Row 1 Tab -->
    <path d="M 24 36 L 6 36 Q 0 36 0 42 L 0 108 Q 0 114 6 114 L 24 114 Z" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="11" cy="75" r="3.5" fill="#A5B4FC"/>

    <!-- Row 2 Tab -->
    <path d="M 24 142 L 6 142 Q 0 142 0 148 L 0 216 Q 0 222 6 222 L 24 222 Z" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="11" cy="182" r="3.5" fill="#A5B4FC"/>

    <!-- Row 3 Tab (Cyan Active Tab for Transpose Origin) -->
    <path d="M 24 250 L 6 250 Q 0 250 0 256 L 0 318 Q 0 324 6 324 L 24 324 Z" fill="#0284C7" fill-opacity="0.5" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="11" cy="287" r="4" fill="#38BDF8"/>
  </g>

  <!-- Main Board Platform -->
  <g transform="translate(76, 76)" filter="url(#card_shadow_2c)">
    <rect width="360" height="360" rx="40" fill="#1E1B4B" fill-opacity="0.8" stroke="#6366F1" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Transposed 3x3 Matrix Grid -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="104" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="208" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.5" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#38BDF8"/>
    </g>

    <!-- Column 2 -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#E0E7FF"/>

      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" fill-opacity="0.6" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#E0E7FF"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(246, 32)">
      <g filter="url(#glow_diff_2c)">
        <rect y="0" width="82" height="86" rx="18" fill="url(#diff_gold_2c)" stroke="#FEF08A" stroke-width="3"/>
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="36" x2="60" y2="36"/>
          <line x1="22" y1="50" x2="60" y2="50"/>
          <line x1="52" y1="25" x2="30" y2="61"/>
        </g>
      </g>

      <rect y="104" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="142" width="54" height="10" rx="5" fill="#64748B"/>

      <rect y="208" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#64748B"/>
    </g>

    <!-- DYNAMIC TRANSPOSE ARROW -->
    <g filter="url(#glow_arc_2c)">
      <path d="M 75 240 C 75 70, 160 18, 236 32" fill="none" stroke="url(#arc_cyan_2c)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 75 240 C 75 70, 160 18, 236 32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
      <polygon points="256,36 226,18 234,48" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>