<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="arc_c3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="diff_gold_c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow_diff_c3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.65"/>
    </filter>
    <filter id="glow_arc_c3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.65"/>
    </filter>
    <filter id="card_shadow_c3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F0E26" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg_c3)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- CLEAN FLOATING HEADER TABS (Solid, no inner lines clutter!) -->
  <!-- Top Column Headers -->
  <g transform="translate(76, 42)">
    <!-- Col 1 -->
    <rect x="32" y="0" width="86" height="14" rx="7" fill="#6366F1" fill-opacity="0.35"/>
    <!-- Col 2 -->
    <rect x="136" y="0" width="92" height="14" rx="7" fill="#6366F1" fill-opacity="0.35"/>
    <!-- Col 3 (Target Col Tab - Solid Glowing Cyan) -->
    <rect x="246" y="0" width="82" height="14" rx="7" fill="#38BDF8"/>
  </g>

  <!-- Left Row Headers -->
  <g transform="translate(42, 76)">
    <!-- Row 1 -->
    <rect x="0" y="32" width="14" height="86" rx="7" fill="#6366F1" fill-opacity="0.35"/>
    <!-- Row 2 -->
    <rect x="0" y="136" width="14" height="86" rx="7" fill="#6366F1" fill-opacity="0.35"/>
    <!-- Row 3 (Origin Row Tab - Solid Glowing Cyan) -->
    <rect x="0" y="240" width="14" height="86" rx="7" fill="#38BDF8"/>
  </g>

  <!-- Main Board Platform -->
  <g transform="translate(76, 76)" filter="url(#card_shadow_c3)">
    <rect width="360" height="360" rx="40" fill="#1E1B4B" fill-opacity="0.65" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Transposed 3x3 Grid -->
    <!-- Column 1 -->
    <g transform="translate(32, 32)">
      <rect y="0" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="38" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="104" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="142" width="54" height="10" rx="5" fill="#A5B4FC"/>

      <rect y="208" width="86" height="86" rx="18" fill="#4338CA" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="246" width="54" height="10" rx="5" fill="#A5B4FC"/>
    </g>

    <!-- Column 2 -->
    <g transform="translate(136, 32)">
      <rect y="0" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="38" width="56" height="10" rx="5" fill="#E0E7FF"/>

      <!-- Center Base Highlight Cell -->
      <rect y="104" width="92" height="86" rx="18" fill="#4F46E5" fill-opacity="0.6" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="18" y="142" width="56" height="10" rx="5" fill="#FFFFFF"/>

      <rect y="208" width="92" height="86" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="18" y="246" width="56" height="10" rx="5" fill="#E0E7FF"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(246, 32)">
      <rect y="0" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="38" width="54" height="10" rx="5" fill="#64748B"/>

      <!-- Row 2: THE DIFF TARGET CELL (GOLD HIGHLIGHT WITH ≠) -->
      <g filter="url(#glow_diff_c3)">
        <rect y="104" width="82" height="86" rx="18" fill="url(#diff_gold_c3)" stroke="#FEF08A" stroke-width="3"/>
        <g stroke="#78350F" stroke-width="4.5" stroke-linecap="round">
          <line x1="22" y1="140" x2="60" y2="140"/>
          <line x1="22" y1="154" x2="60" y2="154"/>
          <line x1="52" y1="129" x2="30" y2="165"/>
        </g>
      </g>

      <rect y="208" width="82" height="86" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
      <rect x="14" y="246" width="48" height="10" rx="5" fill="#64748B"/>
    </g>
  </g>

  <!-- DYNAMIC TRANSPOSE ARROW -->
  <g filter="url(#glow_arc_c3)">
    <!-- Arch starts at Row 3 Cyan Tab, arcs smoothly to Col 3 Cyan Tab -->
    <path d="M 49 330 C 49 110, 150 49, 315 49" fill="none" stroke="url(#arc_c3)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 49 330 C 49 110, 150 49, 315 49" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/>
    <!-- Sharp Arrowhead landing on Col 3 Tab -->
    <polygon points="340,49 310,35 316,63" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>