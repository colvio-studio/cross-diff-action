    </g>

    <!-- Trust & Technical Badges -->
    <g transform="translate(0, 325)">
      <!-- Badge: 100% Native -->
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <g transform="translate(10, 8)">
        <polyline points="1,5 4,8 10,2" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="26" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#34D399">100% Native</text>

      <!-- Badge: AppExchange 2GP -->
      <rect x="125" y="0" width="135" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <g transform="translate(135, 7)">
        <path d="M6 1L1 7H5L4 12L9 5H5L6 1Z" fill="#F59E0B"/>
      </g>
      <text x="150" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0">2GP Managed</text>

      <!-- Badge: Enterprise Ready -->
      <rect x="270" y="0" width="145" height="28" rx="6" fill="#1E1B4B" stroke="#4F46E5"/>
      <g transform="translate(280, 7)">
