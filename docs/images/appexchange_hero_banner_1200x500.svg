      <g transform="translate(336, 10)">
        <path d="M5 1L1 6H4L3 10L8 4.5H4.5L5 1Z" fill="#D97706"/>
      </g>
      <text x="347" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400E">Diff Only</text>

      <!-- Edit Button -->
