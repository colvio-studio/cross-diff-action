    <rect x="14" y="11" width="24" height="24" rx="4" fill="#0176D3"/>
    <g transform="translate(19, 16)" fill="#FFFFFF">
      <rect x="0" y="0" width="3.5" height="3.5" rx="0.5"/>
      <rect x="5.5" y="0" width="3.5" height="3.5" rx="0.5"/>
      <rect x="11" y="0" width="3.5" height="3.5" rx="0.5"/>
      <rect x="0" y="5.5" width="3.5" height="3.5" rx="0.5"/>
      <rect x="5.5" y="5.5" width="3.5" height="3.5" rx="0.5"/>
      <rect x="11" y="5.5" width="3.5" height="3.5" rx="0.5"/>
      <rect x="0" y="11" width="3.5" height="3.5" rx="0.5"/>
      <rect x="5.5" y="11" width="3.5" height="3.5" rx="0.5"/>
      <rect x="11" y="11" width="3.5" height="3.5" rx="0.5"/>
    </g>
    <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#0F172A">CrossDiffAction</text>
    <rect x="156" y="13" width="72" height="20" rx="10" fill="#E0E7FF"/>
    <text x="165" y="27" font-family="-apple-system, sans-serif" font-weight="700" font-size="10" fill="#4338CA">ENTERPRISE</text>

    <!-- Top Action Buttons -->
    <rect x="310" y="11" width="85" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <!-- Copy Icon -->
    <g transform="translate(318, 17)">
      <rect x="2" y="2" width="6" height="8" rx="1" fill="none" stroke="#475569" stroke-width="1"/>
      <path d="M4 2V1H7V2" fill="none" stroke="#475569" stroke-width="1"/>
    </g>
    <text x="330" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Copy Diff</text>

    <rect x="403" y="11" width="83" height="24" rx="4" fill="#0176D3"/>
    <!-- Export Tray Icon -->
    <g transform="translate(412, 17)">
      <path d="M1 6V8C1 8.5 1.5 9 2 9H8C8.5 9 9 8.5 9 8V6M5 1V6M3 4L5 6L7 4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="426" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Export</text>
    <polygon points="468,22 474,22 471,26" fill="#FFFFFF"/>

    <!-- Preset Bar -->
    <g transform="translate(14, 56)">
