        <rect x="2" y="2.5" width="1" height="1" fill="#475569"/>
        <rect x="3.5" y="2.5" width="1" height="1" fill="#475569"/>
        <rect x="2" y="4.5" width="1" height="1" fill="#475569"/>
        <rect x="3.5" y="4.5" width="1" height="1" fill="#475569"/>
      </g>
