        <line x1="6.2" y1="6.2" x2="9" y2="9" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <text x="146" y="21" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Search fields...</text>

