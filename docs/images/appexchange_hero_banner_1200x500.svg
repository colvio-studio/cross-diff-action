        <rect x="3.5" y="0" width="2" height="2"/>
        <rect x="0" y="3.5" width="2" height="2"/>
        <rect x="3.5" y="3.5" width="2" height="2"/>
      </g>
      <text x="268" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Transpose</text>

