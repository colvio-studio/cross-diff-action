        <path d="M1 1C1 0.7 1.3 0.5 1.6 0.5H4L5.2 1.8H10.4C10.7 1.8 11 2.1 11 2.4V8C11 8.3 10.7 8.5 10.4 8.5H1.6C1.3 8.5 1 8.3 1 8V1Z" fill="#F59E0B"/>
      </g>
      <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">Preset: Account Q3 Executive Audit</text>
      
      <!-- Lock Badge -->
      <rect x="385" y="4" width="77" height="18" rx="4" fill="#0F172A"/>
      <g transform="translate(393, 7)">
        <path d="M2.5 3.5V2C2.5 1.2 3.1 0.5 4 0.5C4.9 0.5 5.5 1.2 5.5 2V3.5M1.5 3.5H6.5C6.9 3.5 7.2 3.8 7.2 4.2V7.2C7.2 7.6 6.9 8 6.5 8H1.5C1.1 8 0.8 7.6 0.8 7.2V4.2C0.8 3.8 1.1 3.5 1.5 3.5Z" fill="none" stroke="#F8FAFC" stroke-width="1"/>
      </g>
      <text x="404" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">GLOBAL</text>
    </g>

