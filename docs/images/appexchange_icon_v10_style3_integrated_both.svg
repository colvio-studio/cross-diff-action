<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_v10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <linearGradient id="arc_v10" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="circle_blue_v10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="circle_gold_v10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadow_circles_v10" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.22"/>
    </filter>
    <filter id="gold_glow_v10" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
    <filter id="arc_shadow_v10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
</defs>
  <rect width="512" height="512" rx="112" fill="url(#bg_v10)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#C7D2FE" stroke-width="4"/>
  
  <!-- TWO PURE CIRCLES (cy = 325) -->
  <g filter="url(#shadow_circles_v10)">
    <circle cx="236" cy="325" r="62" fill="url(#circle_blue_v10)"/>
    <circle cx="236" cy="325" r="60.5" fill="none" stroke="#818CF8" stroke-width="3"/>
  </g>
  <g filter="url(#gold_glow_v10)">
    <circle cx="368" cy="325" r="62" fill="url(#circle_gold_v10)"/>
    <circle cx="368" cy="325" r="60.5" fill="none" stroke="#FEF08A" stroke-width="3"/>
  </g>


  <g filter="url(#arc_shadow_v10)">
    <!-- Base Gradient Body (36px) -->
    <path d="M 72 405 C 110 190, 220 92, 385 92" fill="none" stroke="url(#arc_v10)" stroke-width="36" stroke-linecap="round"/>
    <!-- Solid Crisp White Core Line -->
    <path d="M 76 405 C 112 195, 220 92, 400 92" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- TAIL INTEGRATED FLETCHING (左下の流線型矢羽根フィン) -->
    <path d="M 68 420 L 44 430 L 64 390 Z" fill="#4338CA" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 76 405 L 56 375 L 86 370 Z" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

    <!-- HEAD STREAMLINED FLETCHING (右上の流線型矢羽根ヘッド) -->
    <path d="M 448 92 L 388 54 L 404 92 L 388 130 Z" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="442" cy="92" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>